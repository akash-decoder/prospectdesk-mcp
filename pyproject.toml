[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prospectdesk-mcp"
version = "0.1.0"
description = "Local-first business prospecting with an MCP server for Codex"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2", "httpx>=0.27,<1", "pydantic>=2.8,<3", "starlette>=0.37,<2", "uvicorn>=0.30,<1", "jinja2>=3.1,<4", "python-multipart>=0.0.20,<1"]

[project.scripts]
prospectdesk = "prospectdesk:main"

[tool.setuptools]
py-modules = ["prospectdesk", "prospectdb", "prospectweb"]
